[package]
name = "markdown-notes-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Markdown Notes: a VST3 plugin that keeps your notes in the project"

[lib]
name = "markdown_notes_plugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
markdown-notes-core.workspace = true
vst3.workspace = true
# Native Open/Save dialogs, so file operations look like the host's own.
rfd = "0.15"
# default-features off drops the embedded font set (~1.4 MB); the fonts come
# from the operating system instead, see gui::install_system_fonts.
egui = { version = "0.35", default-features = false }
baseview = "0.2.2"
raw-window-handle = "0.6"
dark-light = "2.0.0"

# Headless pixel rendering. Optional because it drags in the whole wgpu/naga
# stack (gigabytes of build output for a plugin that ships as 14 MB) and
# nothing but the snapshot tooling needs it.
egui_kittest = { version = "0.35.0", features = ["wgpu"], optional = true }
image = { version = "0.25.10", optional = true }
font-kit = "0.14.3"
# Mermaid code to SVG.
merman = { version = "0.7.0", features = ["render"] }
# merman takes mermaid's configuration as JSON, and keeps each edge's layout
# points in its SVG as base64 JSON, which elbows.rs reads.
serde_json = "1"
base64 = "0.22"
# SVG to pixels.
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts"] }

# The editor's renderer, chosen per platform.
#
# Windows draws through OpenGL and works. macOS cannot: baseview's
# `NSOpenGLContext` has no usable drawable by the first frame, so the first
# texture the painter asks for comes back as zero and egui_glow panics. wgpu
# draws through Metal there instead.
[target.'cfg(not(target_os = "macos"))'.dependencies]
egui-baseview = { version = "0.6.0", default-features = false, features = ["opengl"] }

[target.'cfg(target_os = "macos")'.dependencies]
egui-baseview = { version = "0.6.0", default-features = false, features = ["wgpu"] }

[dev-dependencies]
# The roles the headless tests query by. Already in the tree under
# egui_kittest; named here so a test can say which role it means.
accesskit = "0.24"
# The renderer merman was chosen over, kept so tests/mermaid_renderers.rs can
# draw the same diagram with both.
mermaid-rs-renderer = { version = "0.3.1", default-features = false }

[features]
# Enables the headless renderer:
#   cargo test -p markdown-notes-plugin --features snapshots
snapshots = ["dep:egui_kittest", "dep:image"]

[[test]]
name = "theme_rendering"
required-features = ["snapshots"]

[[test]]
name = "caret_rendering"
required-features = ["snapshots"]

[[test]]
name = "block_spacing"
required-features = ["snapshots"]

[[test]]
name = "section_dragging"
required-features = ["snapshots"]

[[test]]
name = "title_field"
required-features = ["snapshots"]

[[test]]
name = "text_area"
required-features = ["snapshots"]

[[test]]
name = "selection_rendering"
required-features = ["snapshots"]

[[test]]
name = "clicking_the_document"
required-features = ["snapshots"]

[[test]]
name = "caret_in_view"
required-features = ["snapshots"]

[[test]]
name = "view_mode_button"
required-features = ["snapshots"]

[[test]]
name = "source_view"
required-features = ["snapshots"]

[[test]]
name = "mermaid_blocks"
required-features = ["snapshots"]

[[test]]
name = "mermaid_renderers"
required-features = ["snapshots"]

