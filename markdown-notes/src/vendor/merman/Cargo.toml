[package]
edition = "2024"
rust-version = "1.95"
name = "merman"
version = "0.7.0"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
build = false
exclude = [
    "tests/mindmap_br_variants_031.rs",
    "tests/resvg_safe_fixture_smoke.rs",
    "tests/zed_mermaid_issue_fixtures.rs",
    "tests/zed_pr_57644_corpus.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Parity-focused, headless Rust implementation of Mermaid for parsing, layout, and rendering."
homepage = "https://github.com/Latias94/merman"
documentation = "https://docs.rs/merman"
readme = "README.md"
keywords = [
    "mermaid",
    "diagrams",
    "svg",
    "parser",
    "headless",
]
categories = [
    "parser-implementations",
    "visualization",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latias94/merman"
resolver = "2"

[package.metadata.docs.rs]
features = [
    "render",
    "ascii",
    "raster",
    "ratex-math",
]

[features]
ascii = [
    "dep:merman-ascii",
    "dep:thiserror",
]
default = []
egui-example = [
    "raster",
    "dep:eframe",
]
raster = [
    "render",
    "dep:image",
    "dep:resvg",
    "dep:usvg",
    "dep:tiny-skia",
    "dep:svg2pdf",
]
