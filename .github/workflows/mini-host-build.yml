name: Mini host build

on:
  push:
    branches: [main]
    paths:
      - "tools/mini-host/**"
      - "!**/*.md"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mini-host-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: tools/mini-host

jobs:
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Build
        run: ./build.bat

      - name: Zip
        run: Compress-Archive -Path ../../binaries/mini-host.exe -DestinationPath mini-host-windows-x86_64.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mini-host-windows-x86_64
          path: tools/mini-host/mini-host-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        run: ./build.sh

      - name: Zip
        run: ditto -c -k --sequesterRsrc ../../binaries/mini-host mini-host-macos-arm64.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mini-host-macos-arm64
          path: tools/mini-host/mini-host-macos-arm64.zip
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # The file dialog's crate asks pkg-config for wayland-client when it is
      # built.
      - name: Install what the Linux build needs
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libwayland-dev

      - name: Build
        run: ./build.sh

      # Without its path, so that the archive holds the program and nothing
      # around it.
      - name: Zip
        run: zip -j mini-host-linux-x86_64.zip ../../binaries/mini-host

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mini-host-linux-x86_64
          path: tools/mini-host/mini-host-linux-x86_64.zip
          if-no-files-found: error

# The mini host is a test utility. It is built here to prove it still builds
# on all three platforms, and it is not published.
