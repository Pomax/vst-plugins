name: Mini host build

on:
  push:
    branches: [main]
    paths:
      - "tools/mini-host/**"
      - "!**/*.md"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mini-host-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: tools/mini-host

jobs:
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Build
        run: ./build.bat

      - name: Zip
        run: Compress-Archive -Path ../../binaries/mini-host.exe -DestinationPath mini-host-windows-x86_64.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mini-host-windows-x86_64
          path: tools/mini-host/mini-host-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        run: ./build.sh

      - name: Zip
        run: ditto -c -k --sequesterRsrc ../../binaries/mini-host mini-host-macos-arm64.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mini-host-macos-arm64
          path: tools/mini-host/mini-host-macos-arm64.zip
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install the libraries the window needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build
        run: ./build.sh

      - name: Zip
        run: zip -j mini-host-linux-x86_64.zip ../../binaries/mini-host

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mini-host-linux-x86_64
          path: tools/mini-host/mini-host-linux-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploads the release assets
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Number this release
        id: number
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          published=$(gh api --paginate 'repos/{owner}/{repo}/releases' --jq 'length' \
            | awk '{ total += $1 } END { print total + 0 }')
          echo "n=$((published + 1))" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: mini-host-${{ steps.number.outputs.n }}
          name: Mini host ${{ steps.number.outputs.n }}
          files: |
            artifacts/mini-host-windows-x86_64.zip
            artifacts/mini-host-macos-arm64.zip
            artifacts/mini-host-linux-x86_64.zip
          fail_on_unmatched_files: true
