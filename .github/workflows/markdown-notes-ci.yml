name: Markdown Notes CI

on:
  pull_request:
    paths:
      - "markdown-notes/**"
      - "tools/mini-host/**"
      - ".github/workflows/markdown-notes-ci.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: markdown-notes-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: markdown-notes

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # The build asks pkg-config for fontconfig, freetype and wayland-client.
      # The rendering tests draw through Vulkan, which a runner only has in
      # software, in the system's sans-serif and monospace faces. One of the
      # build tool's own tests runs ffmpeg.
      - name: Install what the Linux build and tests need
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev libwayland-dev \
            mesa-vulkan-drivers fonts-noto-core fonts-dejavu-mono ffmpeg

      - name: Unit tests, scenarios and rendering tests
        run: cargo run -p xtask -- test

  zizmor:
    name: Workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Audit workflows
        run: pipx run zizmor --offline --persona=pedantic --min-severity=low .github/workflows
