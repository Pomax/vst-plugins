name: CI

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # The build asks pkg-config for fontconfig, freetype and wayland-client.
      # The rendering tests draw through Vulkan, which a runner only has in
      # software, in the system's sans-serif and monospace faces. One of the
      # build tool's own tests runs ffmpeg.
      - name: Install what the Linux build and tests need
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev libwayland-dev \
            mesa-vulkan-drivers fonts-noto-core fonts-dejavu-mono ffmpeg

      - name: Every project's tests
        if: runner.os != 'Windows'
        run: sh scripts/test.sh

      - name: Every project's tests
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\test.bat
