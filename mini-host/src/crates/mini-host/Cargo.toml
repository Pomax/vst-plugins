[package]
name = "mini-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "A minimal VST3 host: loads any VST3 plugin and gives its editor a window"

[[bin]]
name = "mini-host"
path = "src/main.rs"

[dependencies]
# The loading itself: this is a window around a loaded plugin, and the
# loading belongs to the loader.
vst3-loader = { path = "../../../../vst3-loader/src/crates/vst3-loader" }
raw-window-handle = "0.6"
# This is an application, so it uses the application shell: eframe owns the
# window, its title bar and its dialogs, and remembers where the window was
# through `persist_window`. A plugin's editor is the other case, and that is
# what baseview is for; it is the plugin that uses it.
#
# `default_fonts` because this is a tool, not a plugin: it is not worth going
# to the operating system for a font to draw two buttons with.
#
# The glow backend, not wgpu. On macOS wgpu registers an Objective-C class
# named "RawWindowMetalLayer", and a class name belongs to the process, not to
# the binary that asks for it. The plugin loaded into this host has its own
# copy of that code, so a host on wgpu means the same name is registered
# twice and whichever comes second aborts.
eframe = { version = "0.35", default-features = false, features = [
    "glow",
    "persistence",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = { version = "0.35", features = ["default_fonts"] }
# The native Open dialog, for when no plugin is named on the command line.
rfd = "0.15"

# A plugin's editor is a window of its own that the host puts inside its own
# window, and moving and focusing someone else's window is the platform's job.
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # Window subclassing, so the plugin's window can be moved from inside the
    # host's resize rather than a frame later.
    "Win32_UI_Shell",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6.4"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
features = ["NSWindow", "NSView", "NSResponder"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
features = ["std", "NSGeometry"]

# The run loop, for letting the plugin draw during a live resize: its frame
# timer lives in the default mode, which a drag does not run.
[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "0.3.2"
features = ["CFRunLoop", "CFDate", "block2"]

[target.'cfg(target_os = "macos")'.dependencies.block2]
version = "0.6"
