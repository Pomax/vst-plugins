[package]
name = "mini-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "A minimal VST3 host: loads any VST3 plugin and gives its editor a window"

[lib]
name = "mini_host"
path = "src/lib.rs"

[[bin]]
name = "mini-host"
path = "src/main.rs"

[dependencies]
vst3.workspace = true
libloading = "0.8"
baseview = "0.2.2"
raw-window-handle = "0.6"
# The host's own strip above the plugin: the preset buttons live there.
# `default_fonts` because this is a tool, not a plugin: it is not worth going
# to the operating system for a font to draw two buttons with.
egui = { version = "0.35", features = ["default_fonts"] }
egui-baseview = { version = "0.6.0", default-features = false, features = ["opengl"] }
# The native Open dialog, for when no plugin is named on the command line.
rfd = "0.15"

# baseview has no window-position API, so placing the window is done through
# the platform directly. The icon is set the same way.
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6.4"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
features = ["NSWindow", "NSView", "NSResponder"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
features = ["std", "NSGeometry"]
